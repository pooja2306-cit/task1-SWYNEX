<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">QuickDesk - System Architecture</text>

  <!-- Users -->
  <rect x="20" y="120" width="140" height="170" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Users</text>
  <text x="90" y="190" text-anchor="middle" font-size="14" fill="#334155">Customer</text>
  <text x="90" y="220" text-anchor="middle" font-size="14" fill="#334155">Agent</text>
  <text x="90" y="250" text-anchor="middle" font-size="14" fill="#334155">Admin</text>

  <!-- Frontend -->
  <rect x="215" y="100" width="200" height="210" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Frontend</text>
  <text x="315" y="150" text-anchor="middle" font-size="12" fill="#1e40af">React + Vite + React Router</text>
  <text x="315" y="182" text-anchor="middle" font-size="13" fill="#1e293b">Login / Register</text>
  <text x="315" y="206" text-anchor="middle" font-size="13" fill="#1e293b">My Tickets</text>
  <text x="315" y="230" text-anchor="middle" font-size="13" fill="#1e293b">New Ticket</text>
  <text x="315" y="254" text-anchor="middle" font-size="13" fill="#1e293b">Ticket Detail + Comments</text>
  <text x="315" y="278" text-anchor="middle" font-size="13" fill="#1e293b">Agent Queue</text>

  <!-- Backend -->
  <rect x="520" y="100" width="200" height="210" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Backend API</text>
  <text x="620" y="150" text-anchor="middle" font-size="12" fill="#166534">Node.js + Express</text>
  <text x="620" y="186" text-anchor="middle" font-size="13" fill="#1e293b">Auth middleware (JWT)</text>
  <text x="620" y="212" text-anchor="middle" font-size="13" fill="#1e293b">Role checks</text>
  <text x="620" y="238" text-anchor="middle" font-size="13" fill="#1e293b">Routes: auth, tickets,</text>
  <text x="620" y="256" text-anchor="middle" font-size="13" fill="#1e293b">comments, users</text>
  <text x="620" y="282" text-anchor="middle" font-size="13" fill="#1e293b">Prisma ORM</text>

  <!-- Database -->
  <rect x="800" y="120" width="140" height="170" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="870" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">PostgreSQL</text>
  <text x="870" y="190" text-anchor="middle" font-size="14" fill="#1e293b">User</text>
  <text x="870" y="220" text-anchor="middle" font-size="14" fill="#1e293b">Ticket</text>
  <text x="870" y="250" text-anchor="middle" font-size="14" fill="#1e293b">Comment</text>

  <!-- Arrows -->
  <line x1="162" y1="205" x2="213" y2="205" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="188" y="195" text-anchor="middle" font-size="11" fill="#475569">Browser</text>

  <line x1="417" y1="190" x2="518" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="467" y="178" text-anchor="middle" font-size="12" fill="#475569">HTTPS</text>
  <text x="467" y="164" text-anchor="middle" font-size="12" fill="#475569">REST / JSON</text>
  <line x1="518" y1="225" x2="417" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="467" y="243" text-anchor="middle" font-size="12" fill="#475569">JSON + JWT</text>

  <line x1="722" y1="190" x2="798" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="760" y="178" text-anchor="middle" font-size="12" fill="#475569">Queries</text>
  <line x1="798" y1="225" x2="722" y2="225" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="760" y="243" text-anchor="middle" font-size="12" fill="#475569">Data</text>

  <!-- Legend -->
  <text x="480" y="365" text-anchor="middle" font-size="13" fill="#64748b">Request flow: User action in browser, API call with JWT, validation and role check, database read/write, JSON response</text>
</svg>
